services:
  customer-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: penchmilk-customer-app
    env_file:
      - ./.env
    environment:
      EXPO_PUBLIC_APP_VARIANT: customer
      EXPO_PUBLIC_API_BASE_URL: ${CUSTOMER_API_BASE_URL:-${BACKEND_API_BASE_URL:-https://somesh-portfolio.online/api}}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${CUSTOMER_APP_PORT:-8081}:8081"
    volumes:
      - .:/app
      - customer_node_modules:/app/node_modules
    stdin_open: true
    tty: true

  delivery-app:
    build:
      context: .
      dockerfile: delivery-app/Dockerfile
    container_name: penchmilk-delivery-app
    env_file:
      - ./.env
    environment:
      EXPO_PUBLIC_APP_VARIANT: delivery
      EXPO_PUBLIC_API_BASE_URL: ${DELIVERY_API_BASE_URL:-${BACKEND_API_BASE_URL:-https://somesh-portfolio.online/api}}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${DELIVERY_APP_PORT:-8084}:8084"
    volumes:
      - .:/app
      - delivery_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  customer_node_modules:
  delivery_node_modules:
