# Copy this file to /etc/nginx/sites-available/penchmilk on the EC2 server.
# Main customer app: http://somesh-portfolio.online
# Delivery app:      http://delivery.somesh-portfolio.online

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream penchmilk_customer_app {
    server 127.0.0.1:8081;
}

upstream penchmilk_delivery_app {
    server 127.0.0.1:8084;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name somesh-portfolio.online www.somesh-portfolio.online 44.204.146.166;

    location / {
        proxy_pass http://penchmilk_customer_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name delivery.somesh-portfolio.online;

    location / {
        proxy_pass http://penchmilk_delivery_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}

